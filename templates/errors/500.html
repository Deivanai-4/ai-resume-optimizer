<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error · AI Career Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#030712;color:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
        .err-wrap{max-width:480px;}
        .err-code{font-size:8rem;font-weight:900;background:linear-gradient(135deg,#F87171,#FB923C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1.5rem;}
        .err-title{font-size:1.75rem;font-weight:800;margin-bottom:0.75rem;}
        .err-sub{font-size:1rem;color:#94A3B8;line-height:1.7;margin-bottom:2rem;}
        .btn-back{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.75rem;border-radius:10px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:white;font-weight:700;text-decoration:none;transition:all 0.2s;}
        .btn-back:hover{color:white;transform:translateY(-2px);}
    </style>
</head>
<body>
    <div class="err-wrap">
        <div class="err-code">500</div>
        <div class="err-title">Server Error</div>
        <p class="err-sub">Something went wrong on our end. Our team has been notified. Please try again in a moment.</p>
        <a href="/" class="btn-back"><i class="bi bi-arrow-counterclockwise"></i> Try Again</a>
    </div>
</body>
</html>
