{% extends "auth_base.html" %}
{% block title %}Forgot Password — AI Career Intelligence Platform{% endblock %}

{% block content %}
<div class="fade-in-up">
    <div style="text-align:center; margin-bottom:var(--space-6);">
        <div style="width:64px; height:64px; border-radius:50%; background:var(--warning-100); display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-4);">
            <i class="bi bi-key-fill" style="font-size:1.5rem; color:var(--warning);"></i>
        </div>
        <h1 class="auth-title" style="font-size:var(--text-xl);">Forgot your password?</h1>
        <p class="auth-sub" style="margin-bottom:0;">Enter your email and we'll send you a reset link.</p>
    </div>

    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <div style="display:flex; flex-direction:column; gap:var(--space-4); margin-bottom:var(--space-5);">
            <div>
                <label class="form-label" for="email">Email Address</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-envelope"></i>
                    <input type="email" class="form-control" id="email" name="email"
                           required autocomplete="email" placeholder="Enter your email address">
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-gradient w-100" style="height:48px;">
            <i class="bi bi-envelope-fill"></i> Send Reset Link
        </button>
    </form>

    <div style="text-align:center; margin-top:var(--space-5);">
        <a href="{{ url_for('auth.login') }}" style="font-size:var(--text-sm); color:var(--text-3);">
            <i class="bi bi-arrow-left"></i> Back to Sign In
        </a>
    </div>
</div>
{% endblock %}
