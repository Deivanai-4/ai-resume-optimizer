<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AI CareerIQ</title>
    <meta name="description" content="Set a new password for your AI CareerIQ account.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d1a;
            overflow: hidden;
            padding: 1rem;
        }

        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            animation: blobFloat 8s ease-in-out infinite alternate;
        }
        .blob-1 { width: 520px; height: 520px; background: #7c3aed; top: -10%; left: -10%; animation-delay: 0s; }
        .blob-2 { width: 420px; height: 420px; background: #06b6d4; bottom: -10%; right: -5%; animation-delay: 2s; }
        .blob-3 { width: 300px; height: 300px; background: #4f46e5; top: 40%; left: 35%; animation-delay: 4s; }
        .blob-4 { width: 250px; height: 250px; background: #a855f7; bottom: 15%; left: 10%; animation-delay: 1s; }

        @keyframes blobFloat {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.08); }
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 2.75rem 2.5rem 2.5rem;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5);
            animation: cardIn 0.55s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
        .logo-icon {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #4f46e5);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: #fff;
            box-shadow: 0 0 14px rgba(6,182,212,0.5);
        }
        .logo-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .card-heading {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.55rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .card-sub {
            text-align: center;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .field-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.25rem; }

        .input-wrap { position: relative; }
        .input-wrap .icon-left {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.5); font-size: 1rem; pointer-events: none;
        }
        .auth-input {
            width: 100%;
            height: 48px;
            padding: 0 1rem 0 2.75rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 100px;
            color: #fff;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-input::placeholder { color: rgba(255,255,255,0.4); }
        .auth-input:focus {
            border-color: rgba(6,182,212,0.7);
            box-shadow: 0 0 0 3px rgba(6,182,212,0.18);
            background: rgba(255,255,255,0.12);
        }
        .auth-input.has-right { padding-right: 3rem; }

        .toggle-eye {
            position: absolute; right: 0; top: 0;
            width: 48px; height: 48px;
            background: transparent; border: none; cursor: pointer;
            color: rgba(255,255,255,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
        }
        .toggle-eye:hover { color: #fff; }

        .btn-submit {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            color: #fff;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 18px rgba(79,70,229,0.4);
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(79,70,229,0.55);
        }
        .btn-submit:active { transform: translateY(0); }

        .card-footer {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.55);
            margin-top: 1.5rem;
        }
        .card-footer a {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .card-footer a:hover { text-decoration: underline; }

        .flash-msg {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fca5a5;
            border-radius: 12px;
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .flash-msg.success {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.35);
            color: #6ee7b7;
        }
        
        .icon-top {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(79,70,229,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.8rem;
            color: #4f46e5;
            border: 1px solid rgba(79,70,229,0.3);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2rem 1.5rem;
            }
            .card-heading {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

<div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
</div>

<div class="auth-card">

    <a href="{{ url_for('index') }}" class="logo-row">
        <div class="logo-icon">
            <i class="bi bi-cpu-fill"></i>
        </div>
        <span class="logo-name">AI CareerIQ</span>
    </a>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="flash-msg {% if category == 'success' %}success{% endif %}">
            <i class="bi bi-{% if category == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i>
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="icon-top">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h1 class="card-heading">Set New Password</h1>
    <p class="card-sub">Choose a strong password for your account.</p>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST" id="resetForm">
        <div class="field-group">
            <div class="input-wrap">
                <i class="bi bi-lock icon-left"></i>
                <input
                    type="password"
                    class="auth-input has-right"
                    id="password"
                    name="password"
                    required
                    autocomplete="new-password"
                    placeholder="New password (Min. 6 characters)"
                >
                <button type="button" class="toggle-eye" onclick="togglePass('password','eyeIcon1')" aria-label="Toggle password visibility">
                    <i class="bi bi-eye" id="eyeIcon1"></i>
                </button>
            </div>
            
            <div class="input-wrap">
                <i class="bi bi-lock-fill icon-left"></i>
                <input
                    type="password"
                    class="auth-input has-right"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    autocomplete="new-password"
                    placeholder="Confirm your new password"
                >
                <button type="button" class="toggle-eye" onclick="togglePass('confirm_password','eyeIcon2')" aria-label="Toggle password visibility">
                    <i class="bi bi-eye" id="eyeIcon2"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="bi bi-check2-circle"></i> Update Password
        </button>
    </form>

    <div class="card-footer">
        <a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i> Back to Login</a>
    </div>

</div>

<script>
function togglePass(id, iconId) {
    const inp = document.getElementById(id);
    const icon = document.getElementById(iconId);
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

document.getElementById('resetForm').addEventListener('submit', function(e) {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirm_password').value;
    if (p1 !== p2) {
        e.preventDefault();
        const inp = document.getElementById('confirm_password');
        inp.style.borderColor = 'rgba(239,68,68,0.7)';
        inp.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.18)';
        
        let err = document.getElementById('match-error');
        if (!err) {
            err = document.createElement('div');
            err.id = 'match-error';
            err.style.cssText = 'font-size:0.75rem; color:#fca5a5; margin-top:5px; padding-left:0.75rem;';
            err.textContent = 'Passwords do not match.';
            inp.closest('.input-wrap').after(err);
        }
        
        setTimeout(() => {
            if (err) err.remove();
            inp.style.borderColor = '';
            inp.style.boxShadow = '';
        }, 3000);
    }
});
</script>

</body>
</html>
