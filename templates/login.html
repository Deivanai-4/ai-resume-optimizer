{% extends "auth_base.html" %}
{% block title %}Login — AI Career Intelligence Platform{% endblock %}

{% block content %}
<div class="fade-in-up">
    <h1 class="auth-title" style="text-align:center; font-size:2rem; font-weight:700; color:#111;">Welcome back</h1>
    <p class="auth-sub" style="text-align:center; color:#444; margin-bottom:2rem;">Sign in to your account to continue your career journey.</p>

    <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm">
        <div style="display:flex; flex-direction:column; gap:1.25rem; margin-bottom:1.5rem;">
            <div>
                <label class="form-label" for="email" style="color:#111; font-weight:600; margin-bottom:0.25rem;">Email</label>
                <div class="input-icon-wrap" style="position:relative;">
                    <i class="bi bi-envelope" style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:#666;"></i>
                    <input type="email" class="form-control auth-input" id="email" name="email"
                           required autocomplete="email" placeholder="Enter your email address"
                           value="{{ request.form.get('email', '') }}"
                           style="padding-left:2.75rem; background:rgba(255,255,255,0.6); border:1px solid rgba(255,255,255,0.8); color:#111; border-radius:100px; height:48px;">
                </div>
            </div>
            <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.25rem;">
                    <label class="form-label" for="password" style="margin:0; color:#111; font-weight:600;">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" style="font-size:0.8rem; color:#4F46E5; text-decoration:none; font-weight:500;">Forgot password?</a>
                </div>
                <div class="input-icon-wrap" style="position:relative; border-radius:100px; overflow:hidden;">
                    <i class="bi bi-lock" style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:#666; z-index:2; pointer-events:none;"></i>
                    <input type="password" class="form-control auth-input" id="password" name="password"
                           required autocomplete="current-password" placeholder="Enter your password"
                           style="padding-left:2.75rem; padding-right:3.25rem; background:rgba(255,255,255,0.6); border:1px solid rgba(255,255,255,0.8); color:#111; border-radius:100px; height:48px; position:relative; z-index:1;">
                    <button type="button" onclick="togglePass('password', 'eyeIcon')"
                            style="position:absolute; right:0; top:0; height:48px; width:48px; background:transparent; border:none; cursor:pointer; color:#555; display:flex; align-items:center; justify-content:center; z-index:3;">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
        </div>

        <button type="submit" class="btn w-100" style="height:48px; border-radius:100px; font-weight:600; background:linear-gradient(to right, #00c6ff, #0072ff); color:white; border:none; box-shadow:0 4px 15px rgba(0, 114, 255, 0.3);">
            Sign In <i class="bi bi-arrow-right ms-1"></i>
        </button>
    </form>

    <div class="divider-text" style="margin:1.5rem 0; color:#111;">
        Don't have an account?
    </div>

    <a href="{{ url_for('auth.register') }}" class="btn w-100" style="height:48px; border-radius:100px; font-weight:600; background:transparent; border:1.5px solid #fff; color:#fff; display:flex; align-items:center; justify-content:center; gap:0.5rem; text-decoration:none;">
        <i class="bi bi-person-plus"></i> Create Account
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePass(id, iconId) {
    const inp = document.getElementById(id);
    const icon = document.getElementById(iconId);
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
{% endblock %}
